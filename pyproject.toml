[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dealhunter"
version = "0.1.0"
description = "CLI inteligente de busca, comparacao, analise de confianca e monitoramento de ofertas"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DealHunter" }]
license = { text = "Proprietary" }
keywords = ["cli", "ofertas", "promocoes", "scraping", "precos"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "typer>=0.12.5",
  "rich>=13.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "platformdirs>=4.3",
  "tomli-w>=1.0",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "respx>=0.21",
  "hypothesis>=6.112",
]
security = [
  "bandit>=1.7",
  "detect-secrets>=1.5",
  "pip-audit>=2.7",
]
secrets = [
  "keyring>=25",
]

[project.scripts]
dealhunter = "dealhunter.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dealhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:dealhunter.*"]
markers = [
  "security: testes de segurança, privacidade e abuso",
  "integration: integração com servidores/adapters locais",
  "e2e: fluxos completos pela CLI",
  "functional: contrato funcional da CLI",
  "regression: regressões de falhas corrigidas",
  "live: entrega real a provedores externos (opt-in)",
  "soak: execução prolongada do monitor (opt-in)",
]

[tool.coverage.run]
source = ["dealhunter"]
branch = true
# `gui/app.py` é a montagem dos widgets Tkinter: exige display e não tem regra
# de negócio. A lógica por trás dela é coberta por gui/controller.py e
# gui/format.py em testes headless.
omit = ["*/data/*", "*/gui/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
