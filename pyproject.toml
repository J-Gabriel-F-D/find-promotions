[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dealhunter"
version = "0.1.0"
description = "CLI inteligente de busca, comparacao, analise de confianca e monitoramento de ofertas"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DealHunter" }]
license = { text = "Proprietary" }
keywords = ["cli", "ofertas", "promocoes", "scraping", "precos"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "typer>=0.12.5",
  "rich>=13.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "platformdirs>=4.3",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
dealhunter = "dealhunter.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dealhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:dealhunter.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
